<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobby, sem conexão</title>
<style>
  :root { --bg:#f4efe6; --ink:#1d1a14; --muted:#6b6457; --card:#fffaf0; --line:#e3dccd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15140f; --ink:#f1ece0; --muted:#a39b8a; --card:#1e1c15; --line:#34312a; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { margin:0 0 8px; font-size:22px; }
  p { margin:0 0 16px; color:var(--muted); }
  a { display:inline-block; padding:12px 18px; border-radius:12px; background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Você está sem conexão</h1>
  <p>Esta tela ainda não foi aberta neste aparelho, então não dá para mostrá-la offline. Seus registros continuam guardados aqui e as telas que você já visitou funcionam normalmente.</p>
  <a href="/biblioteca">Ir para a biblioteca</a>
</main>
</body>
</html>
